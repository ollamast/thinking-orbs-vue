name: Publish to npm

# Publishes on every git tag matching v* (e.g. v0.1.0).
# Uses npm trusted publishing (OIDC): no long-lived npm token is stored, and
# provenance attestations are generated automatically.
# Configure it on npmjs.com → package settings → Trusted publishers
# (repository: ollamast/thinking-orbs-vue, workflow: publish.yml).
# Install and build run on bun; the publish itself goes through npm, which
# is what implements trusted publishing + provenance.


on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      - run: npm audit signatures
      - run: bun run release:check
      # trusted publishing needs npm >= 11.5.1; pin it rather than rely on Node's bundled npm
      - run: npm install -g npm@11.15.0
      - run: npm publish --access public
